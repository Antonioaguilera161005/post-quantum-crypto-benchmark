name: Tests and Reproducibility

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ==========================================================
      # LIBOQS CACHE
      # ==========================================================

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: |
            ~/_oqs_release
          key: ${{ runner.os }}-liboqs-0.16.0-release-dist-v1

      # ==========================================================
      # BUILD LIBOQS ONLY IF CACHE IS EMPTY
      # ==========================================================

      - name: Install liboqs build dependencies
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            git

      - name: Build liboqs 0.16.0
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          git clone \
            --depth 1 \
            --branch 0.16.0 \
            https://github.com/open-quantum-safe/liboqs.git \
            "$RUNNER_TEMP/liboqs"

          cmake \
            -S "$RUNNER_TEMP/liboqs" \
            -B "$RUNNER_TEMP/liboqs/build" \
            -GNinja \
            -DBUILD_SHARED_LIBS=ON \
            -DOQS_DIST_BUILD=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/_oqs_release"

          cmake \
            --build "$RUNNER_TEMP/liboqs/build" \
            --parallel 2

          cmake \
            --install "$RUNNER_TEMP/liboqs/build"

      # ==========================================================
      # ENVIRONMENT
      # ==========================================================

      - name: Configure liboqs environment
        run: |
          echo "OQS_INSTALL_PATH=$HOME/_oqs_release" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/_oqs_release/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show cryptographic environment
        run: |
          python -c "import oqs; print('liboqs:', oqs.oqs_version()); print('liboqs-python:', oqs.oqs_python_version()); print('library:', oqs.native()._name)"

      # ==========================================================
      # TESTS
      # ==========================================================

      - name: Run tests
        run: |
          python -m pytest -v

      # ==========================================================
      # REPRODUCIBILITY
      #
      # Do NOT rerun hardware benchmarks in CI.
      # Raw benchmark data is treated as experimental input.
      # ==========================================================

      - name: Regenerate derived results
        run: |
          python -m analysis.reproduce

      - name: Verify committed results are reproducible
        run: |
          git diff --exit-code -- \
            results/raw/aggregated \
            results/economic

          UNTRACKED="$(git ls-files \
            --others \
            --exclude-standard \
            -- \
            results/raw/aggregated \
            results/economic)"

          if [ -n "$UNTRACKED" ]; then
            echo "Untracked generated result files found:"
            echo "$UNTRACKED"
            exit 1
          fi