name: Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            git

      - name: Build liboqs 0.16.0 in Release mode
        run: |
          git clone \
            --depth 1 \
            --branch 0.16.0 \
            https://github.com/open-quantum-safe/liboqs.git \
            "$HOME/liboqs"

          cmake \
            -S "$HOME/liboqs" \
            -B "$HOME/liboqs/build" \
            -GNinja \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/_oqs_release"

          cmake \
            --build "$HOME/liboqs/build" \
            --parallel 2

          cmake \
            --install "$HOME/liboqs/build"

      - name: Configure liboqs environment
        run: |
          echo "OQS_INSTALL_PATH=$HOME/_oqs_release" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/_oqs_release/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show liboqs configuration
        run: |
          python -c "import oqs; print('liboqs:', oqs.oqs_version()); print('liboqs-python:', oqs.oqs_python_version()); print('library:', oqs.native()._name)"

      - name: Run tests
        run: |
          python -m pytest -v